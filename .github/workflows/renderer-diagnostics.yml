name: Astrava full regression
on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 0'
permissions:
  contents: read
concurrency:
  group: astrava-full-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    uses: ./.github/workflows/validation.yml
    with:
      force_full: true
# This workflow never deploys. Weekly on main, or manual on a selected ref.
