name: WebGPU browser regression
on:
  push:
    branches: [fix/planet-runtime]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: webgpu-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright@1.55.1 pngjs@7.0.0
      - run: npx playwright install --with-deps chromium
      - run: npm run check && npm run build
      - name: Isolated shader probes
        run: timeout 90 node scripts/gpu-probe.mjs
      - name: Local WebGPU render
        if: always()
        run: node scripts/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webgpu-browser-evidence
          path: test-results/
          retention-days: 7
